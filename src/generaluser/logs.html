<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Issue and Maintenance Logs</title>
</head>
<body>
	<header>
		<h1>Issue and Maintenance Logs</h1>
		<a href="log_problem.html">Report a problem</a>
	</header>

	<main>
		<table border="1">
			<caption align="left">Reported issues and maintenance history</caption>
			<thead>
				<tr>
					<th scope="col">Date</th>
					<th scope="col">Truck or Item</th>
					<th scope="col">Issue</th>
					<th scope="col">Priority</th>
					<th scope="col">Status</th>
				</tr>
			</thead>
			<tbody>
				<tr>
					<td colspan="5">No issues or maintenance records to show.</td>
				</tr>
			</tbody>
		</table>
	</main>
</body>
</html>

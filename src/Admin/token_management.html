<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Token Management</title>
</head>
<body>
    <header>
        <h1>Token Management</h1>
    </header>

    <main>
        <p>Company admins can review the company balance and manage token purchases here.</p>
        <table border="1">
            <caption align="left">Token purchase history</caption>
            <thead>
                <tr>
                    <th scope="col">Date</th>
                    <th scope="col">Purchase</th>
                    <th scope="col">Tokens</th>
                    <th scope="col">Balance</th>
                </tr>
            </thead>
            <tbody>
                <tr>
                    <td colspan="4">No token purchases to show.</td>
                </tr>
            </tbody>
        </table>
    </main>
</body>
</html>
